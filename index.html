<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Position Size Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#121212;--field:#2A2A2A;--gold:#D4AF37;--gold-d:#a8891f;--text:#f2f2f2;--mute:#8d8d8d;--card:#1b1b1b;--red:#e5736b;--green:#5fc98b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:6px 0 2px;color:#fff}
h2{font-size:1.15rem;margin:0;color:#fff}
.sub{color:var(--mute);margin:0 0 20px;font-size:.95rem}
.panel{background:var(--card);border-radius:16px;padding:18px;margin-bottom:18px}
.field{margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label,.lbl{display:block;font-size:.85rem;color:var(--mute);margin-bottom:6px}
input,select,textarea{width:100%;min-height:48px;background:var(--field);color:#fff;border:1.5px solid transparent;border-radius:12px;padding:12px 14px;font:inherit;appearance:none;-webkit-appearance:none}
textarea{min-height:70px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input::placeholder,textarea::placeholder{color:#6b6b6b}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--mute);font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#121212}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hint{font-size:.78rem;color:var(--mute);margin-top:5px}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--gold);color:#121212;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
.btn:active{background:var(--gold-d)}
.err{color:var(--red);font-size:.9rem;margin:10px 0 0;min-height:1.2em}
.result{background:linear-gradient(160deg,#e3c35a,var(--gold) 55%,#b8962b);color:#121212;border-radius:16px;padding:20px;margin-bottom:18px}
.result h2{color:#121212;margin-bottom:12px}
.big{font-size:2.3rem;font-weight:800;line-height:1.1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px;border-top:1px solid rgba(0,0,0,.25);padding-top:14px}
.grid span{display:block;font-size:.78rem;opacity:.75}
.grid b{font-size:1.05rem}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.link{background:none;border:0;color:var(--gold);font:inherit;font-weight:600;cursor:pointer;padding:8px 4px;min-height:40px}
.link.del{color:var(--red)}
.confirm{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.entry{background:var(--field);border-radius:12px;padding:14px;margin-bottom:12px}
.entry .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.entry .name{font-weight:700;color:var(--gold)}
.side{margin-left:8px;font-size:.7rem;padding:2px 7px;border-radius:6px;background:#3a3a3a;color:#fff;vertical-align:middle}
.side.buy{color:var(--green)}.side.sell{color:var(--red)}
.entry .when{font-size:.78rem;color:var(--mute)}
.entry dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0 0}
.entry dt{font-size:.74rem;color:var(--mute)}
.entry dd{margin:0;font-weight:600}
.sec{border-top:1px solid #3b3b3b;margin-top:12px;padding-top:12px}
.entry input,.entry textarea{background:#1b1b1b}
.pl{font-weight:700;margin-top:6px}
.pl.pos{color:var(--green)}.pl.neg{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:4px 12px;border-radius:18px;border:1.5px solid #4a4a4a;background:transparent;color:var(--text);font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#121212;font-weight:600}
.empty{color:var(--mute);text-align:center;padding:14px 0 6px;margin:0}
.note{font-size:.78rem;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Position Size Calculator</h1>
<p class="sub">Know your lot size, then journal how the trade went.</p>

<section class="panel" id="calcPanel" aria-label="Calculator">
<div class="two field">
<div><label for="acc">Account currency</label><select id="acc"><option>USD</option></select></div>
<div><label for="inst">Instrument</label>
<select id="inst">
<option value="XAUUSD">XAUUSD</option>
<option value="EURUSD">EURUSD</option>
<option value="GBPUSD">GBPUSD</option>
<option value="AUDUSD">AUDUSD</option>
<option value="BTCUSD">BTCUSD</option>
</select></div>
</div>
<div class="hint" id="pipHint" style="margin:-8px 0 16px"></div>

<div class="field"><span class="lbl">Direction</span>
<div class="seg" role="group" aria-label="Trade direction">
<button type="button" id="dBuy" aria-pressed="true">Buy</button>
<button type="button" id="dSell" aria-pressed="false">Sell</button>
</div></div>

<div class="field"><label for="bal">Account balance ($)</label>
<input id="bal" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 10000"></div>

<div class="field"><span class="lbl">Risk by</span>
<div class="seg" role="group" aria-label="Risk type">
<button type="button" id="mPct" aria-pressed="true">Percent (%)</button>
<button type="button" id="mAmt" aria-pressed="false">Amount ($)</button>
</div></div>

<div class="field"><label for="risk" id="riskLbl">Risk percent (%)</label>
<input id="risk" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 1"></div>

<div class="field"><label for="entry">Entry price (optional)</label>
<input id="entry" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 2650.50"></div>

<div class="two field">
<div><label for="sl">Stop loss (pips)</label>
<input id="sl" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 30"></div>
<div><label for="tp">Take profit (pips)</label>
<input id="tp" type="number" inputmode="decimal" min="0" step="any" placeholder="optional"></div>
</div>

<button class="btn" id="calc" type="button">Calculate</button>
<p class="err" id="err" role="alert"></p>
</section>

<section class="result" id="res" aria-live="polite" hidden>
<h2>Result</h2>
<div class="big" id="rLots">0.00</div><span style="font-size:.85rem;opacity:.75">standard lots</span>
<div class="grid">
<div><span>Risk amount</span><b id="rRisk"></b></div>
<div><span id="rUnitsLbl">Units</span><b id="rUnits"></b></div>
<div><span>Mini lots</span><b id="rMini"></b></div>
<div><span>Micro lots</span><b id="rMicro"></b></div>
<div><span>Pip value per lot</span><b id="rPv"></b></div>
<div id="slBox" hidden><span>Stop loss price</span><b id="rSL"></b></div>
<div id="tpBox" hidden><span>Take profit price</span><b id="rTP"></b></div>
<div id="rrBox" hidden><span>Risk:Reward</span><b id="rRR"></b></div>
<div id="ppBox" hidden><span>Potential profit</span><b id="rPP"></b></div>
</div>
</section>

<section class="panel" aria-label="Trade journal">
<div class="head"><h2>Trade journal</h2>
<div id="clearWrap"></div></div>
<div id="list"></div>
<p class="note" id="storeNote"></p>
</section>
</main>

<script>
(function(){
var SPEC={
 XAUUSD:{pip:0.10,pv:10,contract:100,unit:"oz",dec:2},
 EURUSD:{pip:0.0001,pv:10,contract:100000,unit:"units",dec:5},
 GBPUSD:{pip:0.0001,pv:10,contract:100000,unit:"units",dec:5},
 AUDUSD:{pip:0.0001,pv:10,contract:100000,unit:"units",dec:5},
 BTCUSD:{pip:1,pv:1,contract:1,unit:"BTC",dec:2}
};
var MOODS=["Calm","Confident","Anxious","Greedy","FOMO","Revenge","Bored"];
var KEY="fx-calc-journal-v1";
var $=function(i){return document.getElementById(i)};
var mode="pct",side="buy",entries=[],memOnly=false,confirming=false;

function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function load(){try{var r=localStorage.getItem(KEY);entries=r?JSON.parse(r):[];if(!Array.isArray(entries))entries=[]}catch(e){entries=[];memOnly=true}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){memOnly=true}}
function n(v,d){return Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function usd(v){return "$"+n(v,2)}
function money(v){return (v<0?"-$":"+$")+n(Math.abs(v),2)}
function setMode(m){
 mode=m;
 $("mPct").setAttribute("aria-pressed",m==="pct");
 $("mAmt").setAttribute("aria-pressed",m==="amt");
 $("riskLbl").textContent=m==="pct"?"Risk percent (%)":"Risk amount ($)";
 $("risk").placeholder=m==="pct"?"e.g. 1":"e.g. 100";
 $("risk").value="";
}
function setSide(s){
 side=s;
 $("dBuy").setAttribute("aria-pressed",s==="buy");
 $("dSell").setAttribute("aria-pressed",s==="sell");
}
function hint(){
 var s=SPEC[$("inst").value];
 $("pipHint").textContent="1 pip = "+s.pip+" price move";
}
function plOf(e){
 var s=SPEC[e.inst];
 if(!s||!(e.entry>0)||e.exit==null||!isFinite(e.exit))return null;
 var dir=e.side==="sell"?-1:1;
 return ((e.exit-e.entry)*dir/s.pip)*s.pv*e.lots;
}
function calculate(){
 var inst=$("inst").value,s=SPEC[inst];
 var bal=parseFloat($("bal").value),rv=parseFloat($("risk").value),sl=parseFloat($("sl").value),tp=parseFloat($("tp").value),en=parseFloat($("entry").value);
 var err=$("err");err.textContent="";
 var risk=mode==="pct"?bal*rv/100:rv;
 if(mode==="pct"&&!(bal>0)){err.textContent="Enter your account balance.";return}
 if(!(rv>0)){err.textContent=mode==="pct"?"Enter a risk percent above 0.":"Enter a risk amount above 0.";return}
 if(mode==="amt"&&bal>0&&risk>bal){err.textContent="Risk amount can't be more than your balance.";return}
 if($("entry").value!==""&&!(en>0)){err.textContent="Entry price must be above 0, or leave it empty.";return}
 if(!(sl>0)){err.textContent="Enter a stop loss in pips above 0.";return}
 var lots=risk/(sl*s.pv);
 var units=lots*s.contract;
 var hasTp=tp>0,hasEn=en>0;
 var rr=hasTp?tp/sl:null;
 var profit=hasTp?lots*tp*s.pv:null;
 var dir=side==="sell"?-1:1;
 var slP=hasEn?en-dir*sl*s.pip:null;
 var tpP=(hasEn&&hasTp)?en+dir*tp*s.pip:null;
 var ud=inst==="BTCUSD"?4:(inst==="XAUUSD"?2:0);

 $("rLots").textContent=n(lots,2);
 $("rRisk").textContent=usd(risk);
 $("rUnitsLbl").textContent="Units ("+s.unit+")";
 $("rUnits").textContent=n(units,ud);
 $("rMini").textContent=n(lots*10,2);
 $("rMicro").textContent=n(lots*100,1);
 $("rPv").textContent=usd(s.pv);
 $("slBox").hidden=!hasEn;$("tpBox").hidden=!(hasEn&&hasTp);
 if(hasEn)$("rSL").textContent=n(slP,s.dec);
 if(hasEn&&hasTp)$("rTP").textContent=n(tpP,s.dec);
 $("rrBox").hidden=!hasTp;$("ppBox").hidden=!hasTp;
 if(hasTp){$("rRR").textContent="1 : "+n(rr,2);$("rPP").textContent=usd(profit)}
 $("res").hidden=false;
 $("res").scrollIntoView({behavior:"smooth",block:"nearest"});

 entries.unshift({id:Date.now()+"-"+Math.random().toString(36).slice(2,7),inst:inst,side:side,ts:Date.now(),lots:lots,risk:risk,sl:sl,tp:hasTp?tp:null,rr:rr,profit:profit,entry:hasEn?en:null,slPrice:slP,tpPrice:tpP,exit:null,mood:[],note:""});
 save();render();
}
function renderEntry(e){
 var s=SPEC[e.inst]||SPEC.XAUUSD,d=s.dec;
 var card=h("div","entry");
 var top=h("div","top"),left=h("div");
 var nm=h("div","name",e.inst);
 if(e.side)nm.appendChild(h("span","side "+e.side,e.side.toUpperCase()));
 var dt=new Date(e.ts);
 left.appendChild(nm);
 left.appendChild(h("div","when",dt.toLocaleDateString()+" "+dt.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})));
 var del=h("button","link del","Delete");del.setAttribute("aria-label","Delete "+e.inst+" entry");
 del.onclick=function(){entries=entries.filter(function(x){return x.id!==e.id});save();render()};
 top.appendChild(left);top.appendChild(del);card.appendChild(top);

 var dl=h("dl");
 function row(k,v){var w=h("div");w.appendChild(h("dt",null,k));w.appendChild(h("dd",null,v));dl.appendChild(w)}
 row("Lot size",n(e.lots,2));
 row("Risk amount",usd(e.risk));
 row("Entry price",e.entry>0?n(e.entry,d):"–");
 row("Stop loss",(e.slPrice!=null?n(e.slPrice,d)+" ":"")+"("+n(e.sl,1)+" pips)");
 row("Take profit",e.tp?((e.tpPrice!=null?n(e.tpPrice,d)+" ":"")+"("+n(e.tp,1)+" pips)"):"–");
 row("Risk:Reward",e.rr?"1 : "+n(e.rr,2):"–");
 row("Potential profit",e.profit!=null?usd(e.profit):"–");
 card.appendChild(dl);

 var ex=h("div","sec");
 ex.appendChild(h("label",null,"Exit price"));
 var xi=h("input");xi.type="number";xi.setAttribute("inputmode","decimal");xi.step="any";xi.placeholder="Fill in when the trade closes";
 if(e.exit!=null)xi.value=e.exit;
 xi.onchange=function(){var v=parseFloat(xi.value);e.exit=isFinite(v)&&v>0?v:null;save();render()};
 ex.appendChild(xi);
 var p=plOf(e);
 if(p!=null)ex.appendChild(h("div","pl "+(p>=0?"pos":"neg"),"Result: "+money(p)));
 else if(e.exit!=null&&!(e.entry>0))ex.appendChild(h("div","note","Add an entry price when calculating to see the result."));
 card.appendChild(ex);

 var fl=h("div","sec");
 fl.appendChild(h("div","lbl","How did you feel?"));
 var chips=h("div","chips");
 if(!Array.isArray(e.mood))e.mood=[];
 MOODS.forEach(function(m){
  var c=h("button","chip",m);c.type="button";c.setAttribute("aria-pressed",e.mood.indexOf(m)>-1);
  c.onclick=function(){var i=e.mood.indexOf(m);if(i>-1)e.mood.splice(i,1);else e.mood.push(m);save();c.setAttribute("aria-pressed",e.mood.indexOf(m)>-1)};
  chips.appendChild(c);
 });
 fl.appendChild(chips);
 var ta=h("textarea");ta.placeholder="Notes: why you took it, what you noticed...";ta.style.marginTop="10px";
 ta.value=e.note||"";
 ta.onchange=function(){e.note=ta.value;save()};
 fl.appendChild(ta);
 card.appendChild(fl);
 return card;
}
function render(){
 var list=$("list");list.innerHTML="";
 var cw=$("clearWrap");cw.innerHTML="";
 if(!entries.length){
  list.appendChild(h("p","empty","No saved calculations yet. Each one you run is saved here."));
 } else {
  if(confirming){
   var box=h("div","confirm");
   box.appendChild(h("span","note","Delete all entries?"));
   var y=h("button","link del","Yes, clear");y.onclick=function(){entries=[];confirming=false;save();render()};
   var c=h("button","link","Cancel");c.onclick=function(){confirming=false;render()};
   box.appendChild(y);box.appendChild(c);cw.appendChild(box);
  } else {
   var b=h("button","link del","Clear all");b.onclick=function(){confirming=true;render()};cw.appendChild(b);
  }
  entries.forEach(function(e){list.appendChild(renderEntry(e))});
 }
 $("storeNote").textContent=memOnly?"Saving isn't available in this browser, so entries last only until you close the page.":"Saved on this device. Works offline.";
}
$("mPct").onclick=function(){setMode("pct")};
$("mAmt").onclick=function(){setMode("amt")};
$("dBuy").onclick=function(){setSide("buy")};
$("dSell").onclick=function(){setSide("sell")};
$("inst").onchange=hint;
$("calc").onclick=calculate;
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.closest("#calcPanel"))calculate()});
load();hint();render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
